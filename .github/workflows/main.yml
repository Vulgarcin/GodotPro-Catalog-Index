name: Colector
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -c "p=open('collector.py').read(); open('collector.py','w').write(p.replace(r'C:\Proyectos\GodotPro-Catalog-Index', '.'))"
          python collector.py
          git config user.name "Colector"
          git config user.email "actions@github.com"
          git add catalogo.json
          git diff --staged --quiet || git commit -m "Update catalogo"
          git push
