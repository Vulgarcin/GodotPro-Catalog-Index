name: Colector
on: [workflow_dispatch]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          script=$(find . -maxdepth 3 -name "*colector*.py" | head -n 1)
          echo "Ejecutando: $script"
          python -c "p=open('$script').read(); open('$script','w').write(p.replace(r'C:\Proyectos\GodotPro-Catalog-Index', '.'))"
          python "$script"
          git config user.name "Colector"
          git config user.email "actions@github.com"
          git add catalogo.json
          git diff --staged --quiet || git commit -m "Update catalogo"
          git push
